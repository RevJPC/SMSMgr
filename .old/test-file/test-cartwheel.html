<!DOCTYPE html>
<html>
<head>
    <title>Cartwheel API Test</title>
</head>
<body>
    <h1>Cartwheel API Test</h1>
    <button onclick="testWithAPIToken()">Test Cartwheel API</button>
    <p>Check the browser console (F12) for results</p>

    <script>
    function testWithAPIToken() {
        // Use the token exactly as-is from Doppler
        const apiToken = 'Basic VGFrZW91dENlbnRyYWw6aml5UW5GIUN3Mw==';
        
        // Try different endpoint variations
        const endpoints = [
            'https://app2.cartwheel.tech/app-portal/dynamic/takeoutcentral/api/teams',
            'https://app2.cartwheel.tech/api/takeoutcentral/teams',
            'https://app2.cartwheel.tech/app-portal/api/takeoutcentral/teams'
        ];
        
        endpoints.forEach((url, index) => {
            console.log(`\n--- Testing Endpoint ${index + 1}: ${url} ---`);
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': apiToken,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log(`Status ${index + 1}:`, response.status);
                return response.text();
            })
            .then(data => {
                console.log(`Response ${index + 1}:`, data);
                try {
                    const json = JSON.parse(data);
                    console.log(`✅ SUCCESS on endpoint ${index + 1}:`, json);
                    alert(`Success on endpoint ${index + 1}! Check console.`);
                } catch(e) {
                    console.log(`Not JSON or error`);
                }
            })
            .catch(error => {
                console.log(`❌ Error ${index + 1}:`, error.message);
            });
        });
    }
    </script>
</body>
</html>
